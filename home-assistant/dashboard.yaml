# Lovelace Dashboard – Übersichtsseite Assistenten
#
# Einbindung:
# Einstellungen → Dashboards → "+ Dashboard hinzufügen" → "von Grund auf"
# → öffnen → ⋮ → "Dashboard bearbeiten" → ⋮ → "Steuerung in YAML-Modus"
# → diesen Inhalt einfügen → Speichern.

title: Assistenten
views:
  - title: Übersicht
    path: uebersicht
    icon: mdi:account-group
    cards:
      - type: glance
        title: Aktueller Status
        columns: 3
        entities:
          - entity: binary_sensor.assistentin_anwesend
            name: Anwesend
          - entity: sensor.heute_assistentinnen
            name: Slots heute
          - entity: sensor.offene_slots
            name: Offen

      - type: entities
        title: Wer ist da?
        state_color: true
        entities:
          - entity: sensor.aktuelle_assistentin
            name: Aktuell
            icon: mdi:account-check
          - type: attribute
            entity: sensor.aktuelle_assistentin
            attribute: title
            name: Slot
          - type: attribute
            entity: sensor.aktuelle_assistentin
            attribute: end_time
            name: bis
          - type: attribute
            entity: sensor.aktuelle_assistentin
            attribute: minutes_left
            name: Restzeit
            suffix: " min"

      - type: entities
        title: Nächste Assistentin
        entities:
          - entity: sensor.nachste_assistentin
            name: Wer
            icon: mdi:account-clock
          - type: attribute
            entity: sensor.nachste_assistentin
            attribute: title
            name: Slot
          - type: attribute
            entity: sensor.nachste_assistentin
            attribute: date
            name: Datum
          - type: attribute
            entity: sensor.nachste_assistentin
            attribute: start_time
            name: Start
          - type: attribute
            entity: sensor.nachste_assistentin
            attribute: end_time
            name: Ende
          - type: attribute
            entity: sensor.nachste_assistentin
            attribute: minutes_until
            name: in
            suffix: " min"

      - type: markdown
        title: 📅 Nächste 10 Termine
        content: |
          {% set up = state_attr('sensor.assistenten_status', 'upcoming') %}
          {%- if up and up|length > 0 -%}
          | Datum | Zeit | Wer | Was |
          |-------|------|-----|-----|
          {% for s in up[:10] -%}
          | {{ s.date }} | {{ s.start_time }}–{{ s.end_time }} | {{ s.assistant if s.assistant else '🔓 offen' }} | {{ s.title }} |
          {% endfor %}
          {%- else -%}
          _Keine bevorstehenden Termine._
          {%- endif %}

      - type: markdown
        title: 🔓 Offene Slots
        content: |
          {%- set up = state_attr('sensor.assistenten_status', 'upcoming') -%}
          {%- set open_list = up | selectattr('status', 'equalto', 'open') | list if up else [] -%}
          {%- if open_list -%}
          | Datum | Zeit | Was |
          |-------|------|-----|
          {% for s in open_list -%}
          | {{ s.date }} | {{ s.start_time }}–{{ s.end_time }} | {{ s.title }} |
          {% endfor %}
          {%- else -%}
          ✅ _Alle Slots sind besetzt._
          {%- endif %}
