# Assistenten-App Integration für Home Assistant
#
# Einbindung:
# 1. Diese Datei nach <ha-config>/packages/assistenten.yaml kopieren
# 2. In configuration.yaml hinzufügen:
#      homeassistant:
#        packages: !include_dir_named packages
# 3. Secret in secrets.yaml hinzufügen:
#      assistenten_token: DEIN_ICAL_TOKEN_DES_ADMIN_PROFILS
#      assistenten_base_url: https://karas.pro
# 4. Home Assistant neu starten

rest:
  - resource_template: "{{ states('input_text.assistenten_base_url') }}/api/ha/status?token={{ states('input_text.assistenten_token') }}"
    scan_interval: 60
    timeout: 15
    sensor:
      - name: "Assistenten Status"
        unique_id: assistenten_status
        value_template: >
          {% if value_json.current %}
            {{ value_json.current.assistant }}
          {% elif value_json.next %}
            kommt in {{ value_json.next.minutes_until }} min
          {% else %}
            niemand geplant
          {% endif %}
        json_attributes:
          - generated_at
          - current
          - next
          - today
          - open
          - upcoming

input_text:
  assistenten_token:
    name: Assistenten-App Token
    mode: password
    initial: !secret assistenten_token
  assistenten_base_url:
    name: Assistenten-App URL
    initial: !secret assistenten_base_url

template:
  - sensor:
      - name: "Aktuelle Assistentin"
        unique_id: assistenten_current
        state: >
          {{ state_attr('sensor.assistenten_status', 'current').assistant
             if state_attr('sensor.assistenten_status', 'current')
             else 'niemand' }}
        attributes:
          title: "{{ state_attr('sensor.assistenten_status', 'current').title if state_attr('sensor.assistenten_status', 'current') else '' }}"
          end_time: "{{ state_attr('sensor.assistenten_status', 'current').end_time if state_attr('sensor.assistenten_status', 'current') else '' }}"
          minutes_left: "{{ state_attr('sensor.assistenten_status', 'current').minutes_left if state_attr('sensor.assistenten_status', 'current') else 0 }}"
        icon: >
          {{ 'mdi:account-check' if state_attr('sensor.assistenten_status', 'current') else 'mdi:account-off' }}

      - name: "Nächste Assistentin"
        unique_id: assistenten_next
        state: >
          {{ state_attr('sensor.assistenten_status', 'next').assistant
             if state_attr('sensor.assistenten_status', 'next')
             else 'unbekannt' }}
        attributes:
          title: "{{ state_attr('sensor.assistenten_status', 'next').title if state_attr('sensor.assistenten_status', 'next') else '' }}"
          date: "{{ state_attr('sensor.assistenten_status', 'next').date if state_attr('sensor.assistenten_status', 'next') else '' }}"
          start_time: "{{ state_attr('sensor.assistenten_status', 'next').start_time if state_attr('sensor.assistenten_status', 'next') else '' }}"
          end_time: "{{ state_attr('sensor.assistenten_status', 'next').end_time if state_attr('sensor.assistenten_status', 'next') else '' }}"
          minutes_until: "{{ state_attr('sensor.assistenten_status', 'next').minutes_until if state_attr('sensor.assistenten_status', 'next') else 0 }}"
        icon: mdi:clock-outline

      - sensor:
          name: "Offene Slots"
          unique_id: assistenten_open_count
          state: "{{ state_attr('sensor.assistenten_status', 'open').count }}"
          unit_of_measurement: "Slots"
          icon: >
            {{ 'mdi:calendar-alert' if state_attr('sensor.assistenten_status', 'open').count | int(0) > 0 else 'mdi:calendar-check' }}

      - sensor:
          name: "Heute Assistentinnen"
          unique_id: assistenten_today_count
          state: "{{ state_attr('sensor.assistenten_status', 'today').slots_count | default(0) }}"
          unit_of_measurement: "Slots"
          attributes:
            assistants: "{{ state_attr('sensor.assistenten_status', 'today').assistants | default([]) }}"
          icon: mdi:calendar-today

  - binary_sensor:
      - name: "Assistentin anwesend"
        unique_id: assistenten_present
        state: "{{ state_attr('sensor.assistenten_status', 'current') is not none }}"
        device_class: occupancy
        icon: >
          {{ 'mdi:home-account' if state_attr('sensor.assistenten_status', 'current') else 'mdi:home-outline' }}
