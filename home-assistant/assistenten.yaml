# Assistenten-App Integration für Home Assistant
#
# Einbindung:
# 1. Diese Datei nach <ha-config>/packages/assistenten.yaml kopieren
# 2. In configuration.yaml hinzufügen (falls noch nicht vorhanden):
#      homeassistant:
#        packages: !include_dir_named packages
# 3. In secrets.yaml hinzufügen:
#      assistenten_url: "https://assistenz.charmely.cloud/api/ha/status?token=DEIN-ICAL-TOKEN"
# 4. Home Assistant neu starten (NICHT nur "YAML neu laden", das reicht für packages nicht)

rest:
  - resource: !secret assistenten_url
    scan_interval: 60
    timeout: 15
    sensor:
      - name: "Assistenten Status"
        unique_id: assistenten_status
        value_template: >
          {% if value_json.current %}
            {{ value_json.current.assistant }}
          {% elif value_json.next %}
            kommt in {{ value_json.next.minutes_until }} min
          {% else %}
            niemand geplant
          {% endif %}
        json_attributes:
          - generated_at
          - current
          - next
          - today
          - open
          - upcoming

template:
  - sensor:
      - name: "Aktuelle Assistentin"
        unique_id: assistenten_current
        state: >
          {% set c = state_attr('sensor.assistenten_status', 'current') %}
          {{ c.assistant if c else 'niemand' }}
        icon: >
          {% set c = state_attr('sensor.assistenten_status', 'current') %}
          {{ 'mdi:account-check' if c else 'mdi:account-off' }}
        attributes:
          title: >
            {% set c = state_attr('sensor.assistenten_status', 'current') %}
            {{ c.title if c else '' }}
          end_time: >
            {% set c = state_attr('sensor.assistenten_status', 'current') %}
            {{ c.end_time if c else '' }}
          minutes_left: >
            {% set c = state_attr('sensor.assistenten_status', 'current') %}
            {{ c.minutes_left if c else 0 }}

      - name: "Nächste Assistentin"
        unique_id: assistenten_next
        state: >
          {% set n = state_attr('sensor.assistenten_status', 'next') %}
          {{ n.assistant if n else 'unbekannt' }}
        icon: mdi:clock-outline
        attributes:
          title: >
            {% set n = state_attr('sensor.assistenten_status', 'next') %}
            {{ n.title if n else '' }}
          date: >
            {% set n = state_attr('sensor.assistenten_status', 'next') %}
            {{ n.date if n else '' }}
          start_time: >
            {% set n = state_attr('sensor.assistenten_status', 'next') %}
            {{ n.start_time if n else '' }}
          end_time: >
            {% set n = state_attr('sensor.assistenten_status', 'next') %}
            {{ n.end_time if n else '' }}
          minutes_until: >
            {% set n = state_attr('sensor.assistenten_status', 'next') %}
            {{ n.minutes_until if n else 0 }}

      - name: "Offene Slots"
        unique_id: assistenten_open_count
        state: >
          {% set o = state_attr('sensor.assistenten_status', 'open') %}
          {{ o.count if o else 0 }}
        unit_of_measurement: "Slots"
        icon: >
          {% set o = state_attr('sensor.assistenten_status', 'open') %}
          {{ 'mdi:calendar-alert' if (o and o.count | int(0) > 0) else 'mdi:calendar-check' }}

      - name: "Heute Assistentinnen"
        unique_id: assistenten_today_count
        state: >
          {% set t = state_attr('sensor.assistenten_status', 'today') %}
          {{ t.slots_count if t else 0 }}
        unit_of_measurement: "Slots"
        icon: mdi:calendar-today
        attributes:
          assistants: >
            {% set t = state_attr('sensor.assistenten_status', 'today') %}
            {{ t.assistants if t else [] }}

    binary_sensor:
      - name: "Assistentin anwesend"
        unique_id: assistenten_present
        state: "{{ state_attr('sensor.assistenten_status', 'current') is not none }}"
        device_class: occupancy
        icon: >
          {% set c = state_attr('sensor.assistenten_status', 'current') %}
          {{ 'mdi:home-account' if c else 'mdi:home-outline' }}
